name: Pull Request

# GitHub blocks pull_request_target in public repositories by default. A
# repository Actions policy (Settings > Actions > Policies) allows it for this
# workflow only, matched by its file path, so renaming or moving this file
# blocks the check until the policy's workflow path is updated to match.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: npm install @commitlint/config-conventional
      - run: npx commitlint <<< $CONVENTIONAL_COMMIT
        env:
          CONVENTIONAL_COMMIT: |
            ${{ github.event.pull_request.title }}

            ${{ github.event.pull_request.body }}
      - if: failure()
        run:
          echo "Substrait follows the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/) for release automation.
          The PR title and body are used as the merge commit message.

          Please update your PR title to match the specification." >> $GITHUB_STEP_SUMMARY
